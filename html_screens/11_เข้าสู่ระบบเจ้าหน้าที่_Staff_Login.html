<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบเจ้าหน้าที่ - ท้องฟ้าจำลองรังสิต</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="preload" as="style" href="http://localhost/build/assets/app-CNRoyAwL.css" /><link rel="modulepreload" as="script" href="http://localhost/build/assets/app-BvRk9kiK.js" />    <style>
        body {
            font-family: 'IBM Plex Sans Thai', sans-serif;
        }

        .font-display {
            font-family: 'Chakra Petch', 'IBM Plex Sans Thai', sans-serif;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <!-- Background Glow Effects -->
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-cyan-500/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-indigo-500/20 rounded-full blur-3xl pointer-events-none"></div>

    <div class="max-w-md w-full relative z-10">
        
        <!-- Brand Logo & Title -->
        <div class="text-center mb-8">
            <a href="http://localhost" class="inline-block mb-3">
                <img src="images/logo.jpg" alt="โลโก้ท้องฟ้าจำลองรังสิต"
                    class="h-16 w-auto object-contain mx-auto rounded-xl p-1 bg-white shadow-md">
            </a>
            <h1 class="text-2xl font-bold font-display text-white">เข้าสู่ระบบเจ้าหน้าที่</h1>
            <p class="text-xs text-slate-400 mt-1">ระบบขายตั๋วหน้าร้าน (POS) & ตรวจตั๋วเข้าชม</p>
        </div>

        <!-- Login Card -->
        <div class="bg-slate-800/90 backdrop-blur-xl p-8 rounded-3xl border border-slate-700 shadow-2xl">
            
            
            <form action="http://localhost/login" method="POST" class="space-y-5">
                <input type="hidden" name="_token" value="" autocomplete="off">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">อีเมลเจ้าหน้าที่ (Email)</label>
                    <div class="relative">
                        <input type="email" name="email" required value="" autofocus
                            placeholder="อีเมลเจ้าหน้าที่"
                            class="w-full bg-slate-900/80 border border-slate-600 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-400 focus:border-transparent text-sm transition">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">รหัสผ่าน (Password)</label>
                    <input type="password" name="password" required
                        placeholder="••••••••"
                        class="w-full bg-slate-900/80 border border-slate-600 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-400 focus:border-transparent text-sm transition">
                </div>

                <button type="submit"
                    class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-600 hover:to-blue-700 text-white font-semibold py-3.5 px-6 rounded-xl shadow-lg transition duration-200 text-sm font-display tracking-wide">
                    เข้าสู่ระบบ
                </button>
            </form>

            <div class="mt-6 pt-6 border-t border-slate-700/60 text-center">
                <a href="http://localhost"
                    class="text-xs text-slate-400 hover:text-cyan-300 transition inline-flex items-center gap-1">
                    <span>← กลับสู่หน้าหลักสำหรับผู้เข้าชม</span>
                </a>
            </div>
        </div>

        <p class="text-center text-xs text-slate-500 mt-6">
            ศูนย์วิทยาศาสตร์เพื่อการศึกษารังสิต &bull; ท้องฟ้าจำลองรังสิต
        </p>
    </div>

</body>

</html>
